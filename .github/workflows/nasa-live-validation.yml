name: NASA live data collection

# Temporary one-time push trigger to verify the final integrated report; manual thereafter.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nasa-live-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasa-live-data
  cancel-in-progress: true

jobs:
  collect-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and analyze NASA data
        run: |
          python -m science_core.cli \
            --latitude 38.5598 \
            --longitude 68.7870 \
            --start 20210101 \
            --end 20251231 \
            --imagery-start 2021-01-01 \
            --imagery-end 2025-12-31 \
            --image-count 60 \
            --minimum-images 50 \
            --image-width 512 \
            --image-height 512 \
            --ndvi-start 2001-01-01 \
            --ndvi-end 2025-12-31 \
            --ndvi-radius-km 2 \
            --ndvi-minimum-years 15 \
            --skip-gibs \
            --output artifacts
      - name: Upload NASA data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-real-data-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
